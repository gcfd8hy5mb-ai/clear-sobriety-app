name: CLEAR backend checks
on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/clear-backend-tests.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/clear-backend-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run scheduler unit tests
        working-directory: server
        run: npm test
